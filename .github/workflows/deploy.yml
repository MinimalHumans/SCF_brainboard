name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: brainboard/package-lock.json

      - name: Install dependencies
        working-directory: brainboard
        run: npm ci

      - name: Build project
        working-directory: brainboard
        run: npm run build

      - name: Zip dist directory
        run: |
          cd brainboard/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deployment Webhook
        if: success()
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}?token=${{ secrets.DEPLOY_SECRET }}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed for ${context.ref}`,
              body: `The deploy workflow failed for tag \`${context.ref}\`.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignees: ['krets']
            })
