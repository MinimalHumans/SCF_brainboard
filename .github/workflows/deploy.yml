name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip creating/updating the release and calling the deploy webhook'
        type: boolean
        default: true

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: brainboard/package-lock.json

      - name: Install dependencies
        working-directory: brainboard
        run: npm ci

      - name: Build project
        working-directory: brainboard
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Zip dist directory
        run: |
          cd brainboard/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create Release
        id: create_release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deployment Webhook
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          max_attempts=5
          delay=15
          success=false
          for attempt in $(seq 1 $max_attempts); do
            if response=$(curl --fail -sS \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                -X POST \
                -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
                "${{ secrets.DEPLOY_WEBHOOK_URL }}"); then
              if echo "$response" | grep -q "Successfully deployed"; then
                echo "$response"
                success=true
                break
              fi
              echo "::warning::Attempt $attempt/$max_attempts: webhook responded but didn't confirm deployment (possibly a WAF/bot-check interstitial instead of the deploy script)."
            else
              echo "::warning::Attempt $attempt/$max_attempts: curl request to deploy webhook failed."
            fi
            [ "$attempt" -lt "$max_attempts" ] && sleep "$delay"
          done
          if [ "$success" != true ]; then
            echo "::error::Deploy webhook never confirmed a successful deploy after $max_attempts attempts."
            echo "Last response body:"
            echo "$response"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed for ${context.ref}`,
              body: `The deploy workflow failed for tag \`${context.ref}\`.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignees: ['krets']
            })

  build-dev:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: brainboard/package-lock.json

      - name: Install dependencies
        working-directory: brainboard
        run: npm ci

      - name: Build project
        working-directory: brainboard
        env:
          VITE_APP_VERSION: dev
          VITE_BUILD_SHA: ${{ github.sha }}
          # brainboard/public/auth/index.php ships automatically with every
          # build (Vite copies public/ into dist/ verbatim, same as
          # favicon.ico) and lands at <dev-site-root>/auth/index.php once
          # deployed. This overrides brainboard/.env's prod broker URL so
          # the dev build calls its own same-origin copy instead of prod's.
          VITE_AUTH_BROKER_URL: https://dev.scriptyard.minimalhumans.com/auth/index.php
        run: npm run build

      - name: Zip dist directory
        run: |
          cd brainboard/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create/update dev release
        id: create_dev_release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: 'Dev (latest main)'
          files: dist.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger dev deployment webhook
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          max_attempts=5
          delay=15
          success=false
          for attempt in $(seq 1 $max_attempts); do
            if response=$(curl --fail -sS \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                -X POST \
                -H "X-Deploy-Token: ${{ secrets.DEV_DEPLOY_SECRET }}" \
                "${{ secrets.DEPLOY_WEBHOOK_URL }}?env=dev"); then
              if echo "$response" | grep -q "Successfully deployed"; then
                echo "$response"
                success=true
                break
              fi
              echo "::warning::Attempt $attempt/$max_attempts: webhook responded but didn't confirm deployment (possibly a WAF/bot-check interstitial instead of the deploy script)."
            else
              echo "::warning::Attempt $attempt/$max_attempts: curl request to deploy webhook failed."
            fi
            [ "$attempt" -lt "$max_attempts" ] && sleep "$delay"
          done
          if [ "$success" != true ]; then
            echo "::error::Deploy webhook never confirmed a successful deploy after $max_attempts attempts."
            echo "Last response body:"
            echo "$response"
            exit 1
          fi
