name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip creating/updating the release and calling the deploy webhook'
        type: boolean
        default: true

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: brainboard/package-lock.json

      - name: Install dependencies
        working-directory: brainboard
        run: npm ci

      - name: Build project
        working-directory: brainboard
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Zip dist directory
        run: |
          cd brainboard/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create Release
        id: create_release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deployment Webhook
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed for ${context.ref}`,
              body: `The deploy workflow failed for tag \`${context.ref}\`.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignees: ['krets']
            })

  build-dev:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: brainboard/package-lock.json

      - name: Install dependencies
        working-directory: brainboard
        run: npm ci

      - name: Build project
        working-directory: brainboard
        env:
          VITE_APP_VERSION: dev
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Zip dist directory
        run: |
          cd brainboard/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create/update dev release
        id: create_dev_release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: 'Dev (latest main)'
          files: dist.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger dev deployment webhook
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEV_DEPLOY_SECRET }}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}?env=dev"
